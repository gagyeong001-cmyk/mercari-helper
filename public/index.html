<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8b74b"><link rel="manifest" href="/manifest.webmanifest"><title>식완허브 메루카리 탐색</title><style>body{font-family:system-ui,sans-serif;background:#fff9ee;color:#28221a;margin:0}main{max-width:850px;margin:auto;padding:22px}h1{font-size:25px}form{display:flex;gap:8px;flex-wrap:wrap}input{padding:13px;border:1px solid #ddd;border-radius:10px;flex:1;min-width:210px}button{border:0;border-radius:10px;background:#f4b744;padding:12px;cursor:pointer}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%;background:white;margin-top:18px}td,th{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}small{display:block;color:#666}a{color:#855300;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.muted{color:#666}#status{min-height:24px}td button{background:#eee} @media(max-width:550px){th:nth-child(1),td:nth-child(1){display:none}td,th{padding:8px 5px;font-size:13px}}</style></head><body><main><h1>🐰 식완허브 메루카리 탐색</h1><p class="muted">링크만 넣으면 상품명·한국어 번역·엔화 가격을 조회해 누적합니다.</p><form id="form"><input id="url" type="url" placeholder="https://jp.mercari.com/item/m..." required><button id="submit">자동 추출 · 추가</button></form><p id="status" role="status"></p><div class="actions"><button id="copy">구매대행용 표 복사</button><button id="csv">CSV 저장</button></div><p id="count"></p><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>상품명 (일본어 / 한국어)</th><th>가격</th><th>링크</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><p class="muted">목록은 현재 브라우저에만 저장됩니다. CSV로 백업해 주세요. 자동 추출은 외부 서비스 설정 후 작동합니다.</p></main><script>
const key='shokugan-mercari-items-v1';let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch{};const el=id=>document.getElementById(id);const save=()=>{localStorage.setItem(key,JSON.stringify(items));render()};function render(){el('rows').replaceChildren();items.forEach((x,i)=>{let tr=document.createElement('tr');let values=[String(i+1),x.title+'\n'+(x.korean||''),Number(x.price).toLocaleString()+'엔',x.url];values.forEach((v,j)=>{let td=document.createElement('td');if(j===3){let a=document.createElement('a');a.href=v;a.target='_blank';a.rel='noopener';a.textContent='매물 열기';td.append(a)}else{td.textContent=v;td.style.whiteSpace='pre-line'}tr.append(td)});let td=document.createElement('td');let edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>{let title=prompt('일본어 상품명',x.title);if(title===null)return;let korean=prompt('한국어 번역',x.korean||'');if(korean===null)return;let price=prompt('가격 (엔)',x.price);if(price===null)return;if(!Number.isFinite(Number(price)))return alert('가격은 숫자로 입력하세요');items[i]={...x,title,korean,price:Number(price)};save()};let del=document.createElement('button');del.textContent='삭제';del.onclick=()=>{if(confirm('삭제할까요?')){items.splice(i,1);save()}};td.append(edit,del);tr.append(td);el('rows').append(tr)});el('count').textContent=items.length+'건 · 합계 '+items.reduce((s,x)=>s+Number(x.price||0),0).toLocaleString()+'엔'}
el('form').onsubmit=async e=>{e.preventDefault();const url=el('url').value.trim();if(items.some(x=>x.url===url))return el('status').textContent='이미 등록된 링크입니다.';el('submit').disabled=true;el('status').textContent='상품 정보를 조회하고 있어요…';try{const r=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});const d=await r.json();if(!r.ok)throw Error(d.error||'추출 실패');if(items.some(x=>x.url===d.url))throw Error('이미 등록된 링크입니다.');items.push(d);save();el('url').value='';el('status').textContent='추가 완료!'}catch(err){el('status').textContent=err.message}finally{el('submit').disabled=false}};
const tsv=()=>[['번호','일본어 상품명','한국어 상품명','가격(엔)','링크'],...items.map((x,i)=>[i+1,x.title,x.korean,x.price,x.url])].map(x=>x.join('\t')).join('\n');el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(tsv());el('status').textContent='복사 완료!'}catch{el('status').textContent='복사할 수 없습니다.'}};el('csv').onclick=()=>{let csv='\ufeff'+[['번호','일본어 상품명','한국어 상품명','가격(엔)','링크'],...items.map((x,i)=>[i+1,x.title,x.korean,x.price,x.url])].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='mercari-list.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
</script></body></html>
