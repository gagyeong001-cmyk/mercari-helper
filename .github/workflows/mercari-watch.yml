name: Mercari email watch
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mercari-email-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'main' && 'main' || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check new listings
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NAVER_EMAIL: ${{ secrets.NAVER_EMAIL }}
          NAVER_SMTP_PASSWORD: ${{ secrets.NAVER_SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: node watch.mjs
      - name: Save seen listings
        run: |
          if ! git diff --quiet -- watch-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add watch-state.json
            git commit -m "chore: update Mercari watch state"
            git push
          fi
